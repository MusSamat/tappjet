services:
  postgres:
    image: postgres:16-alpine
    container_name: kosho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosho
      POSTGRES_PASSWORD: kosho
      POSTGRES_DB: kosho
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kosho -d kosho']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: kosho-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosho
      POSTGRES_PASSWORD: kosho
      POSTGRES_DB: kosho_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kosho -d kosho_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
